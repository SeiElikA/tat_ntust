name: flutter_app
description: NTUST Life TAT, convenient, concise, fast, powerful, enrich your NTUST life!

# you can use this command to build both android app bundle and ios ipa:
# flutter clean && flutter build ios --split-debug-info=build/app/outputs/symbols --obfuscate && flutter build appbundle --split-debug-info=build/app/outputs/symbols --obfuscate --shrink
# follow the google play new policy in 2021, do not build apk but aab.
# CHECK THE BUILD CODE BEFORE DISTRIBUTION!!
version: 1.6.6+118
publish_to: none

environment:
  flutter: ">=3.3.0 <4.0.0"
  sdk: "^3.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_plugin_android_lifecycle: ^2.0.33
  # 直接被 5 個 lib/ 檔案 import（file_utils、file_viewer 那一組）。先前是靠
  # 原本是 provider 帶進來的傳遞相依，provider 移除之後要自己宣告。
  path: ^1.9.0
  path_provider: ^2.1.5
  url_launcher: ^6.3.2
  url_launcher_ios: ^6.3.6
  url_launcher_android: ^6.3.28
  video_player_android: ^2.9.1
  #開啟email phone url...
  logger: ^2.1.0
  #顯示Log
  sprintf: ^7.0.0
  flutter_local_notifications: ^19.4.1
  #通知欄  需修改android原始碼
  android_intent_plus: ^6.0.0
  device_info_plus: ^9.1.2
  html_unescape: ^2.0.0
  #處理HTML特殊字
  local_auth: ^3.0.0
  #驗證身分指紋
  version: ^3.0.2
  #版本比較
  #選擇android資料夾
  #----------store data----------#
  shared_preferences: ^2.5.4
  flutter_secure_storage: ^9.2.4
  #帳密與 Moodle token 改存 Keystore / Keychain
  flutter_cache_manager: ^3.4.1
  #----------internet----------#
  dio: ^5.4.1
  #網路get post API
  dio_cookie_manager: ^3.1.1
  #用於產生cookie_jar與dio接口
  cookie_jar: ^4.0.8
  #可儲存式cookies
  html: ^0.15.2
  #html解析器
  fk_user_agent:
    git:
      url: https://github.com/maeltoukap/fk_user_agent.git
      ref: master
  connectivity_plus: ^5.0.2
  clipboard: ^0.1.3
  #剪貼簿
  #----------WebView----------#
  flutter_inappwebview: ^6.1.0
  webview_flutter_android: ^4.10.11
  #---------icon----------#
  eva_icons_flutter: ^3.1.0
  #https://akveo.github.io/eva-icons/#/
  fluttericon: ^2.0.0
  #https://oblador.github.io/react-native-vector-icons/
  #---------json----------#
  json_annotation: ^4.8.0
  #----------other----------#
  back_button_interceptor: ^7.0.2
  #攔截返回鍵訊息
  #DateTime to String
  package_info_plus: ^8.3.0
  #檢測app版本用於檢查更新
  upgrader: ^13.7.0
  #iOS 查 App Store 有沒有新版
  in_app_update: ^4.2.5
  #Android 走 Play 的 in-app update
  #----------html viewer----------#
  #flutter_html: ^2.2.1
  flutter_widget_from_html: ^0.17.1
  #----------animation----------#
  flutter_staggered_animations: ^1.1.1
  #listView or gridView動畫
  #----------download----------#
  open_filex: ^4.7.0
  permission_handler: ^12.0.1
  mime_type: ^1.0.0
  github: ^9.11.0
  #----------Widget----------#
  get: ^4.6.5
  bot_toast: ^4.0.3
  #提供ListView可下拉式更新並且可動態加載
  cached_network_image: ^3.2.3
  #用url顯示圖片
  auto_size_text: ^3.0.0
  #課表顯示有用到
  table_calendar: ^3.0.9
  #顯示行事曆
  expansion_tile_card: ^3.0.0
  fluttertoast: ^9.0.0
  #Toast
  awesome_dialog: ^3.3.0
  #顯示Error時用到
  flutter_slidable: ^3.0.1
  #email使用可左右滑抽屜
  flutter_spinkit: ^5.1.0
  #等待動畫
  card_swiper: ^3.0.1
  #公告
  flutter_markdown: ^0.6.14
  numberpicker: ^2.1.1
  #選擇學期
  alice_lightweight: ^3.1.0
  pretty_json: ^2.0.0
  icalendar_parser: ^2.0.0
  charset_converter: ^2.3.0

  # Firebase
  firebase_core: ^2.8.0
  firebase_analytics: ^10.1.6
  firebase_crashlytics: ^3.0.17
  firebase_remote_config: ^4.3.17
  firebase_messaging: ^14.3.0
  flutter_svg: ^2.0.10+1
  screenshot: ^3.0.0
  photo_view: ^0.14.0
  shimmer: ^3.0.0
  flutter_native_splash: ^2.4.0
  dynamic_color: 1.7.0
  intl: ^0.18.0
  crypto: ^3.0.3
  google_fonts: ^8.2.1
  # 驗證 Moodle launch.php 回傳的 signature（md5）。
  # 直接相依：l10n 產生的程式碼、file_utils 與課程公告頁都直接 import intl。
  # 先前只寫在 dependency_overrides，於是 analyzer 一路報
  # depend_on_referenced_packages。


dependency_overrides:
  # flutter_localizations 綁定的 intl 版本比 0.18 舊，需要蓋掉。
  intl: ^0.18.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  #flutter pub run flutter_launcher_icons:main -f pubspec.yaml
  #利用以下的flutter_icons設定icon位置
  #---------json----------#
  build_runner: ^2.3.3
  json_serializable: ^6.6.1
  flutter_lints: ^3.0.1
  rive_native: ^0.1.3


flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/image/
    - assets/image/files/
    - assets/launcher/
    # 隱私政策的離線備援。宣告 repo 根目錄那一份而不是複本：GitHub raw 服務
    # 的就是同一個檔案。見 PrivacyPolicyController.load。
    - privacy-policy.md

  # 沒有任何內建字體。
  #
  # MyFont（源泉圓體，三個 TTC 共 45 MB）改成用 google_fonts 在執行期抓
  # Noto Sans TC，見 lib/src/config/app_themes.dart。
  #
  # MyIcon（assets/fonts/MyIcon.ttf，5.7 KB）一併刪除：整個 repo 沒有任何
  # 一處用到那個 family，是一份只宣告沒使用的設定。

flutter_intl:
  enabled: true

flutter_icons:
  ios: true
  android: true
  image_path_ios: "assets/launcher/ios-icon.png"
  image_path_android: "assets/launcher/android-icon.png"
  adaptive_icon_background: "assets/launcher/background.png"
  adaptive_icon_foreground: "assets/launcher/foreground.png"

# 兩個平台共用同一組資產：中央是和 launcher icon 同款的黑色圓形徽章（128dp），
# 亮暗只差背景色（取自 ColorScheme.surface）。圓底畫在圖裡而不是交給 Android 12 的
# icon_background_color，因為那個圓固定 240dp、縮不了，三邊就湊不到同一個大小。
# 改這裡之後要重跑 `dart run flutter_native_splash:create`，並把 values*/styles.xml
# 的 LaunchTheme parent 改回 Theme.AppCompat.NoActionBar（local_auth 需要）。
flutter_native_splash:
  color: "#f8f9ff"
  color_dark: "#111418"
  # 徽章亮暗共用，image_dark 指向同一張才會連 drawable-night 也一起產生。
  image: assets/splash/splash_badge.png
  image_dark: assets/splash/splash_badge.png
  android_12:
    # Android 12 起啟動圖由系統畫，圖必須是 1152x1152、內容落在內圈 768 圓內。
    image: assets/splash/splash_badge_android12.png
    image_dark: assets/splash/splash_badge_android12.png
